<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>喵工位 · 桌宠</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="bubble" class="bubble hidden"></div>
  <div id="hourglass" class="hourglass hidden">
    <canvas id="hourglass-canvas"></canvas>
    <div id="hourglass-text" class="hourglass-text"></div>
  </div>
  <canvas id="cat" width="220" height="280"></canvas>

  <div id="actions" class="actions">
    <button data-act="feed" title="喂鱼干">🐟</button>
    <button data-act="panel" title="打开面板">📖</button>
    <button data-act="pomodoro" title="开始 / 暂停番茄">🍅</button>
  </div>

  <div id="grip" class="grip" title="拖动调整大小"><i></i></div>
  <div id="size-tip" class="size-tip hidden"></div>

  <script src="../shared/config.js"></script>
  <script src="catRenderer.js"></script>
  <script src="stateMachine.js"></script>
  <script src="affection.js"></script>
  <script src="dragHandler.js"></script>
  <script src="pet.js"></script>
</body>
</html>
